<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MariKit is offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #171717;
        color: #fafafa;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 28rem;
        border: 1px solid #404040;
        border-radius: 0.75rem;
        background: #262626;
        padding: 1.5rem;
      }
      h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
      p { margin: 0 0 1.25rem; color: #d4d4d4; }
      a {
        display: inline-block;
        border-radius: 0.6rem;
        background: #fafafa;
        color: #171717;
        padding: 0.65rem 1.25rem;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: #e5e5e5; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        MariKit can only open pages you have already visited. Reconnect to the internet, then retry this page.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
